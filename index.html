<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreams by DRS — Eventos & Celebraciones</title>
  <meta name="description" content="Dreams by DRS — planeación y producción de eventos y celebraciones inolvidables en Miami." />
  <style>
    :root{
      --bg:#0e0b12; --panel:#171320; --ink:#f6f1ea; --muted:#c9bfd6;
      --gold:#d9b26b; --rose:#c98a9b; --line:rgba(217,178,107,.35);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
      background:radial-gradient(1200px 600px at 50% -10%,#241a2e 0%,var(--bg) 60%);
      color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; padding:32px 20px;
    }
    .wrap{max-width:640px; width:100%}
    .brand{
      font-size:clamp(34px,8vw,64px); font-weight:700; letter-spacing:.5px; line-height:1.05;
      background:linear-gradient(90deg,var(--gold),var(--rose)); -webkit-background-clip:text;
      background-clip:text; color:transparent;
    }
    .kicker{font-size:13px; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin-bottom:18px}
    .tag{font-size:clamp(16px,4vw,20px); color:var(--muted); margin:22px 0 8px}
    .sub{font-size:14px; color:var(--muted); opacity:.8}
    .divider{width:60px; height:1px; background:var(--line); margin:28px auto}
    .soon{
      display:inline-block; margin-top:8px; padding:12px 26px; border:1px solid var(--line);
      border-radius:999px; font-size:14px; letter-spacing:2px; text-transform:uppercase; color:var(--ink);
    }
    .contact{margin-top:34px; font-size:15px}
    .contact a{color:var(--gold); text-decoration:none; border-bottom:1px solid transparent}
    .contact a:hover{border-bottom-color:var(--gold)}
    footer{margin-top:44px; font-size:12px; color:var(--muted); opacity:.6}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">Eventos &amp; Celebraciones</p>
    <h1 class="brand">Dreams by DRS</h1>
    <p class="tag">Convertimos tus momentos en experiencias inolvidables.</p>
    <p class="sub">Planeación y producción de eventos · Miami, FL</p>
    <div class="divider"></div>
    <span class="soon">Nuevo sitio en camino</span>
    <p class="contact">Reserva o consulta: <a href="mailto:info@dreamsbydrs.com">info@dreamsbydrs.com</a></p>
    <footer>© <span id="y"></span> Dreams by DRS. Todos los derechos reservados.</footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
